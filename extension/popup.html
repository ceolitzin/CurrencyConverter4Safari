<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  body { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; padding: 14px; width: 260px; }
  h1 { font-size: 14px; margin: 0 0 12px; }
  label { display: block; font-size: 12px; opacity: .75; margin: 10px 0 4px; }
  select { width: 100%; font-size: 13px; padding: 4px; }
  .meta { font-size: 11px; opacity: .65; margin-top: 12px; line-height: 1.45; }
  .meta a { color: inherit; }
  button { margin-top: 10px; width: 100%; padding: 5px; font-size: 12px; }
  .ok { color: #2a9d4b; font-size: 11px; height: 14px; margin-top: 6px; }
</style>
</head>
<body>
  <h1 data-i18n="extName"></h1>
  <label for="target" data-i18n="convertTo"></label>
  <select id="target"></select>

  <label for="dollar" id="dollarLabel"></label>
  <select id="dollar"></select>

  <div class="ok" id="ok" role="status"></div>
  <button id="refresh" data-i18n="refreshRates"></button>
  <div class="meta" id="meta" data-i18n="loading"></div>
  <script src="popup.js"></script>
</body>
</html>
